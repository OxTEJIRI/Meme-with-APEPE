<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game viewport preview</title><style>*{box-sizing:border-box}body{margin:0;background:#ddd9cd;font:13px Arial,sans-serif;color:#244336;overflow:hidden}nav{height:47px;display:flex;align-items:center;justify-content:center;gap:12px}button{font:inherit;padding:7px 12px;border:1px solid #a7ad99;background:#fffaf0;color:#244336;border-radius:5px;cursor:pointer}button[aria-pressed=true]{background:#244336;color:#fffaf0}#frame-box{position:absolute;left:50%;transform:translateX(-50%);transform-origin:top center}iframe{display:block;border:0;transform-origin:top left;background:#f6edda}</style><nav><button id="desktop" aria-pressed="true">Desktop · 1440 × 960</button><button id="mobile" aria-pressed="false">Mobile · 390 × 844</button></nav><div id="frame-box"><iframe title="Responsive game preview" src="/" width="1440" height="960"></iframe></div><script>const frame=document.querySelector('iframe'),box=document.querySelector('#frame-box');let width=1440,height=960;function fit(){const scale=Math.min((innerWidth-20)/width,(innerHeight-60)/height,1);frame.width=width;frame.height=height;frame.style.transform='scale('+scale+')';box.style.width=width*scale+'px';box.style.height=height*scale+'px'}for(const mode of ['desktop','mobile'])document.querySelector('#'+mode).onclick=()=>{width=mode==='desktop'?1440:390;height=mode==='desktop'?960:844;document.querySelector('#desktop').setAttribute('aria-pressed',mode==='desktop');document.querySelector('#mobile').setAttribute('aria-pressed',mode==='mobile');fit()};addEventListener('resize',fit);fit();</script></html>
